seed: 42

collect:
  cutoff_date: "2022-11-30"
  target_sources: 300
  chunk_words: [150, 350]
  max_chunks_per_source: 3

# The Analyst runs once per chunk on a local model, so every generator writes from the same facts.
analyst:
  provider: ollama
  model: llama3.1:8b
  concurrency: 3
  extra: {format: json}

# Model names were checked against each provider's model list on 2026-10-23.
# A-C are local training generators from three model families; they run one after another on the GPU.
# D-E are larger API models used only as unseen test generators. Their free tiers allow
# ~200k tokens/day (Groq) and ~500 requests/day (Gemini), so they fill up over several days.
generators:
  A:
    provider: ollama
    model: llama3.1:8b
    concurrency: 3
  B:
    provider: ollama
    model: qwen2.5:7b
    concurrency: 3
  C:
    provider: ollama
    model: mistral:7b
    concurrency: 3
  D:
    test_only: true
    provider: groq
    model: openai/gpt-oss-120b
    concurrency: 2
    rpm: 6          # 8000 tokens/min is the binding per-minute limit
    extra: {reasoning_effort: low}
  E:
    test_only: true
    provider: gemini
    model: gemini-3.1-flash-lite   # gemini-2.5-flash free tier allows only 20 requests/day
    concurrency: 4
    rpm: 10

sampling:
  temperatures: [0.7, 1.0]
  analyst_temperature: 0.2
  max_tokens: 700
  single_agent_share: 0.2   # sources also generated by one agent in one call (ablation)
  limit: null               # set to a small number for a smoke test

# Rewriting and prompt-strategy conditions for the robustness experiments. Base texts are the multi-agent texts
# of the local generators, for excerpts whose source is in the test split of at least one seed.
variants:
  generators: [A, B, C]
  cross_executor: {A: B, B: C, C: A}   # who paraphrases whose text in paraphrase_cross
  pivot_language: German               # back-translation pivot; chosen for translation quality of the local models
  n_style_examples: 2
  prompts:
    paraphrase: |
      Rewrite the text below in different words and with different sentence structure. Keep every fact, name
      and number. Do not add or remove information. Return only the rewritten text.
      Text: {text}
    humanize: |
      Rewrite the text below so that it reads as if an experienced human analyst at a national CERT wrote it:
      plain and specific wording, varied sentence length, no filler, no first person, no advice to the reader
      unless the text already gives it. Keep every fact, name and number. Return only the rewritten text.
      Text: {text}
    to_pivot: |
      Translate the text below into {language}. Keep names and identifiers unchanged. Return only the translation.
      Text: {text}
    from_pivot: |
      Translate the text below into English. Keep names and identifiers unchanged. Return only the translation.
      Text: {text}
    style_writer: |
      Using only the facts below, write about {n_words} words of continuous prose in the impersonal register of
      a government cybersecurity advisory: state who did what, repeat identifiers exactly, do not use the first
      person, do not address the reader, do not speculate. Return only the text.
      Facts: {facts}
    fewshot_writer: |
      Here are excerpts from real cybersecurity advisories. Study their wording and structure.
      {examples}
      Now write a new excerpt of about {n_words} words in the same style, using only the facts below.
      Do not reuse content from the examples. Return only the text.
      Facts: {facts}

# Human CTI from other publishers, used only as an independent test set (never in the main training sets).
# Text is copyrighted: raw excerpts stay out of the repository and are rebuilt by `collect_ext`.
external:
  generators: [A, B, C]
  sources_per_publisher: 80
  publishers:
    microsoft:
      index: https://www.microsoft.com/en-us/security/blog/sitemap_index.xml
    mandiant:
      index: https://cloud.google.com/transform/sitemapsummary/cloudblog

agents:
  analyst: |
    You are a threat intelligence analyst. Read the report excerpt and extract the facts it states.
    Return only JSON with these keys: actor, malware, cves, ttps, targets, sectors, indicators_types,
    timeline, impact, mitigations. Use empty lists or null when the excerpt does not mention something.
    Do not add facts that are not in the excerpt.

  editor: |
    You are a senior editor at a threat intelligence team. You get a list of facts and a draft. Revise the
    draft so it is accurate to the facts, reads like a finished CTI text and stays close to {n_words} words.
    Do not add new facts. Return only the revised text, with no title and no notes.

  single: |
    You are a threat intelligence analyst. Read the report excerpt below and write a new CTI text of about
    {n_words} words that covers the same activity in your own words. Return only the text.
    Excerpt: {text}

  writer_templates:
    t1: |
      You are a SOC analyst writing an internal threat bulletin for your security team.
      Using only the facts below, write about {n_words} words of continuous prose.
      Return only the text.
      Facts: {facts}
    t2: |
      You work for a security vendor and are writing a paragraph for the company's threat research blog.
      Base it strictly on these facts and keep it to roughly {n_words} words. Output the paragraph only.
      Facts: {facts}
    t3: |
      Write a section of a government cybersecurity advisory (about {n_words} words) that informs network
      defenders about the activity described by these facts. No headings, no bullet points.
      Facts: {facts}
    t4: |
      You are an incident responder. Write an excerpt of a technical incident report, around {n_words} words,
      describing what the facts below show. Plain paragraphs only.
      Facts: {facts}
